name: CI

on: [push, pull_request]

jobs:
  build-test:
    # Needs Swift 6.2+: a pinned dependency (swift-sdk) uses the of:-less
    # withThrowingTaskGroup form. macos-15 ships the newer Xcode/Swift toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Package.swift needs swift-tools-version 6.0, but the runner's default Xcode is
      # Swift 5.10 — select the newest stable Xcode (16.x → Swift 6) explicitly so
      # `swift build`/`swift test` resolve the package instead of failing at manifest load.
      - name: Select Swift 6 toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build (release)
        run: swift build -c release
      # Unit tests only (DateWindow, Renderer, CLIParsing, Auth, Serve). CI cannot grant
      # macOS Calendar (TCC) access, so there are no live EventKit reads here. These
      # suites also can't run on a Command Line Tools-only box (no XCTest); the Xcode
      # selected above provides it.
      - name: Test (debug)
        run: swift test
      # The HTTP transport once aborted in release builds only (a Swift-runtime
      # `swift_task_dealloc` fatal error out of a background task) while the debug
      # suite stayed green for two months. Run the suite at the optimization level
      # users actually get so that class of bug has somewhere to show up. Costs about
      # as much as the release build above: `swift test` adds `-enable-testing` to
      # every module, so the classic build backend recompiles the dependency graph.
      - name: Test (release)
        run: swift test -c release
